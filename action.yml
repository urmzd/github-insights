name: "GitHub Insights - Profile Enhancer"
description: "Generate SVG insights visualizations for your GitHub profile README"
author: "urmzd"
branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token (needs repo read)"
    default: ${{ github.token }}
  username:
    description: "GitHub username to generate metrics for"
    default: ${{ github.repository_owner }}
  output-dir:
    description: "Directory to write SVG files to"
    default: "assets/insights"
  commit-push:
    description: "Whether to commit and push generated files"
    default: "true"
  commit-message:
    description: "Commit message when committing generated files"
    default: "chore: update metrics"
  commit-name:
    description: "Git user name for commits"
    default: "github-actions[bot]"
  commit-email:
    description: "Git user email for commits"
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  config-file:
    description: "Path to github-insights.yml config file (also accepts .yaml)"
    default: "github-insights.yml"
  readme-path:
    description: "Output path for the generated profile README (set to 'none' to skip)"
    default: "README.md"
  template:
    description: "Section preset (classic, modern, minimal, ecosystem, showcase). Ignored if 'sections' is specified."
    default: "showcase"
  sections:
    description: "Comma-separated ordered list of sections: spotlight, velocity, rhythm, constellation, impact, portfolio. Overrides 'template' preset."
    default: ""
  ai-base-url:
    description: "OpenAI-compatible API base URL for AI summaries and classification. Defaults to local Ollama, which is not available on GitHub-hosted runners, so AI is skipped there unless you point this at a hosted provider. Set to an empty string or 'none' to disable AI."
    default: "http://localhost:11434/v1"
  ai-model:
    description: "Model name served by ai-base-url (for Ollama, any pulled model works)"
    default: "qwen3.5:4b"
  ai-api-key:
    description: "API key sent as a Bearer token. Ollama needs none; hosted providers do. Pass it from a secret."
    default: ""
  ai-reasoning-effort:
    description: "reasoning_effort sent with each request. 'none' turns off thinking for local models and lets gpt-6 models accept temperature. Set to an empty string to omit it for models that reject the parameter."
    default: "none"
  fail-fast:
    description: "Exit with an error instead of falling back to heuristics when AI is unavailable"
    default: "false"
  export-json:
    description: "Export underlying JSON data alongside SVGs for auditing"
    default: "false"
  cache:
    description: "Reuse AI outputs when inputs are unchanged"
    default: "true"
runs:
  using: "node24"
  main: "dist/index.js"
