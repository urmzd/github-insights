# GitHub Insights configuration
# See: https://github.com/urmzd/github-insights

# name: Your Name
# pronunciation: your-name
# title: Software Engineer
# desired_title: Senior Software Engineer
# bio: Building things on the internet.
# preamble: PREAMBLE.md

template: showcase

sections:
  - spotlight
  - velocity
  - rhythm
  - constellation
  # - stack
  - portfolio
  - impact

exclude_archived: true

# How to group projects in the constellation chart: "language" or "category"
# constellation_group_by: language

# When true, the pipeline will fail instead of falling back to heuristics
# when AI classification or preamble generation is unavailable.
# fail_fast: false

# AI prompt valves: override model, temperature, reasoning effort, or prompt
# text per task. The endpoint and default model come from --ai-base-url and
# --ai-model (or the ai-base-url / ai-model action inputs).
# Values can be inline strings or paths to .txt/.md files.
# ai:
#   preamble:
#     model: qwen3.5:4b
#     temperature: 0.5
#     reasoning_effort: none
#     system: prompts/preamble-system.txt
#     user: prompts/preamble-user.txt
#   classification:
#     model: qwen3.5:4b
#     temperature: 0.15
#     system: prompts/classification-system.txt
#     user: prompts/classification-user.txt
